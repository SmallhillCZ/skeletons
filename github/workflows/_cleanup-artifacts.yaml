name: Cleanup artifacts

on:
  workflow_call:

jobs:
  cleanup-artifacts:
    name: Cleanup artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          name: |
            *-docker-image
          failOnError: false
