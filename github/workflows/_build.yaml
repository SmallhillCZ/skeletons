name: Build

on:
  workflow_call:
    inputs:
      target:
        description: "Dockerfile stage to build"
        type: string
        required: true
      version:
        description: "Version to use for the built Docker images"
        type: string
        required: false

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the updated source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ inputs.target }}
          tags: ${{ inputs.target }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ inputs.target }}-docker-image.tar
          cache-from: type=gha,scope=${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}
          build-args: VERSION=${{ inputs.version }}

      - name: Upload Docker image tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-docker-image
          path: ${{ runner.temp }}/${{ inputs.target }}-docker-image.tar
          retention-days: 1
