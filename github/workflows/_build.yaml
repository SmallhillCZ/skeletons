name: Build

on:
  workflow_call:
    inputs:
      image:
        description: "Image reference to build and push"
        type: string
        required: true
      target:
        description: "Dockerfile stage to build"
        type: string
        required: true
      version:
        description: "Version to use for the built Docker images"
        type: string
        required: false

jobs:
  build:
    name: Build and publish ${{ inputs.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the updated source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ inputs.target }}
          tags: ${{ inputs.image }}
          push: true
          cache-from: type=gha,scope=${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}
          build-args: VERSION=${{ inputs.version }}
