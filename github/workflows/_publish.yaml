name: Publish

on:
  workflow_call:
    inputs:
      image:
        description: "Image reference to push"
        type: string
        required: true
      target:
        description: "Dockerfile stage that was built"
        type: string
        required: true

jobs:
  publish:
    name: Publish ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the updated source code
        uses: actions/checkout@v6

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Docker image tarball
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.target }}-docker-image

      - name: Load Docker image from tarball
        run: |
          docker load -i ${{ inputs.target }}-docker-image.tar
          rm ${{ inputs.target }}-docker-image.tar

      - name: Push image to the container registry
        run: |
          docker tag ${{ inputs.target }}:${{ github.sha }} ${{ inputs.image }}
          docker push ${{ inputs.image }}
