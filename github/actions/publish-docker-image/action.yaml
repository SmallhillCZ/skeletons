name: Publish Docker image

inputs:
    target:
        description: "Target build stage in the Dockerfile"
        type: string
        required: true
    publish-name:
        description: "Name of the published docker image"
        required: true
    registry:
        description: "Container registry for the published docker image"
        required: true
    tag:
        description: "Push under this tag"
    version:
        description: "Version to tag"
        type: string
        required: false
    username:
        description: "Username for the container registry"
        required: true
    password:
        description: "Password for the container registry"
        required: true

outputs:
    images:
        description: "List of pushed images, separated by commas"
        value: ${{ steps.set-images-output.outputs.images }}

runs:
    using: composite
    steps:
        - name: Login to container registry
          uses: docker/login-action@v3
          with:
              registry: ${{ inputs.registry }}
              username: ${{ inputs.username }}
              password: ${{ inputs.password }}

        - name: Download Docker image tarball
          uses: actions/download-artifact@v4
          with:
              name: ${{ inputs.artifact-name }}

        - name: Load Docker image from tarball
          shell: bash
          run: |
              docker load -i ${{ inputs.artifact-name }}.tar
              rm ${{ inputs.artifact-name }}.tar

        - name: Push ${{ inputs.tag }} tag to the container registry
          id: push-tag
          if: inputs.tag != ''
          shell: bash
          run: |
              docker tag ${{ inputs.source-image-name }}:${{ github.sha }} ${{ inputs.registry }}/${{ inputs.publish-image-name }}:${{ inputs.tag }}
              docker push ${{ inputs.registry }}/${{ inputs.publish-image-name }}:${{ inputs.tag }}
              echo "image=${{ inputs.registry }}/${{ inputs.publish-image-name }}:${{ inputs.tag }}" >> $GITHUB_OUTPUT

        - name: Push version tags to the container registry
          id: push-version
          if: inputs.version != ''
          shell: bash
          run: |
              VERSION="${{ inputs.version }}"

              # Parse version components (X.Y.Z -> X, X.Y, X.Y.Z)
              IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
              MAJOR="${VERSION_PARTS[0]}"
              MINOR="${VERSION_PARTS[1]}"
              PATCH="${VERSION_PARTS[2]}"

              # Tag and push major version (X)
              docker tag ${{ inputs.source-image-name }}:${{ github.sha }} ${{ inputs.registry }}/${{ inputs.publish-image-name }}:$MAJOR
              docker push ${{ inputs.registry }}/${{ inputs.publish-image-name }}:$MAJOR

              # Tag and push major.minor version (X.Y)
              docker tag ${{ inputs.source-image-name }}:${{ github.sha }} ${{ inputs.registry }}/${{ inputs.publish-image-name }}:$MAJOR.$MINOR
              docker push ${{ inputs.registry }}/${{ inputs.publish-image-name }}:$MAJOR.$MINOR

              # Tag and push full version (X.Y.Z)
              docker tag ${{ inputs.source-image-name }}:${{ github.sha }} ${{ inputs.registry }}/${{ inputs.publish-image-name }}:$MAJOR.$MINOR.$PATCH
              docker push ${{ inputs.registry }}/${{ inputs.publish-image-name }}:$MAJOR.$MINOR.$PATCH

              # Build images array
              images=()
              images+=("${{ inputs.registry }}/${{ inputs.publish-image-name }}:$MAJOR")
              images+=("${{ inputs.registry }}/${{ inputs.publish-image-name }}:$MAJOR.$MINOR")
              images+=("${{ inputs.registry }}/${{ inputs.publish-image-name }}:$MAJOR.$MINOR.$PATCH")

              # Join array elements with comma and output
              output=$(printf ",%s" "${images[@]}")
              output=${output:1}  # remove leading comma
              echo "images=$output" >> $GITHUB_OUTPUT

        - name: Set images output
          id: set-images-output
          shell: bash
          run: |
              combined=()

              if [ -n "${{ steps.push-tag.outputs.image }}" ]; then
                combined+=("${{ steps.push-tag.outputs.image }}")
              fi
              if [ -n "${{ steps.push-version.outputs.images }}" ]; then
                combined+=("${{ steps.push-version.outputs.images }}")
              fi

              # Join array elements with comma
              output=$(printf ",%s" "${combined[@]}")
              output=${output:1}  # remove leading comma
              echo "images=$output" >> $GITHUB_OUTPUT
